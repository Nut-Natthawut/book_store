---
info:
  name: 01 Create - 201
  type: http
  seq: 1
http:
  method: POST
  url: "{{base_url}}/api/v1/markets"
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  - name: X-CSRF-Token
    value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
        "market": {
          "name": "ร้านหนังสือบ้านนักอ่าน"
        }
      }
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201) {
        bru.setVar("market_id", res.body.id);
      }
  - type: tests
    code: |-
      test("HTTP 201", function () {
        expect(res.status).to.equal(201);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
