---
info:
  name: 05 Create Error - 422
  type: http
  seq: 5
http:
  method: POST
  url: "{{base_url}}/api/v1/markets"
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  - name: X-CSRF-Token
    value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
        "market": {
          "name": ""
        }
      }
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 422", function () {
        expect(res.status).to.equal(422);
      });
      test("JSON errors", function () {
        expect(res.body.errors).to.be.an("array").that.is.not.empty;
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
