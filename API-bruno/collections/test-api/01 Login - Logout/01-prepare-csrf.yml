---
info:
  name: 01 Prepare CSRF - 200
  type: http
  seq: 1
http:
  method: GET
  url: "{{base_url}}/api/v1/session/new"
  headers:
  - name: Accept
    value: application/json
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 200) {
        bru.setVar("csrf_token", res.body.csrf_token);
      }
  - type: tests
    code: |-
      test("HTTP 200", function () {
        expect(res.status).to.equal(200);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
