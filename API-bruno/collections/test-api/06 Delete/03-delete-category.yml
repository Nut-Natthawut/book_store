---
info:
  name: 03 Delete Category - 204
  type: http
  seq: 3
http:
  method: DELETE
  url: "{{base_url}}/api/v1/categories/{{category_id}}"
  headers:
  - name: Accept
    value: application/json
  - name: X-CSRF-Token
    value: "{{csrf_token}}"
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: if (!bru.getVar("category_id")) throw new Error("Run the create request
      for category_id first");
  - type: tests
    code: |-
      test("HTTP 204", function () {
        expect(res.status).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
