---
info:
  name: 03 Show - 200
  type: http
  seq: 3
http:
  method: GET
  url: "{{base_url}}/api/v1/categories/{{category_id}}"
  headers:
  - name: Accept
    value: application/json
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: if (!bru.getVar("category_id")) throw new Error("Run the create request
      for category_id first");
  - type: tests
    code: |-
      test("HTTP 200", function () {
        expect(res.status).to.equal(200);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
