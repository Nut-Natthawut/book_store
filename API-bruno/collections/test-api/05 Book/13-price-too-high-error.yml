---
info:
  name: 13 Price Too High Error - 422
  type: http
  seq: 13
http:
  method: POST
  url: "{{base_url}}/api/v1/books"
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  - name: X-CSRF-Token
    value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
        "book": {
          "title": "Refactoring",
          "author": "Martin Fowler",
          "description": "ปรับปรุงโค้ดเดิมให้ดีขึ้น",
          "price": 100000000,
          "category_id": {{category_id}}
        }
      }
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      if (!bru.getVar("category_id")) throw new Error("Run the create request for category_id first");
  - type: tests
    code: |-
      test("HTTP 422", function () {
        expect(res.status).to.equal(422);
      });
      test("JSON errors", function () {
        expect(res.body.errors).to.be.an("array").that.is.not.empty;
      });
      test("Error message", function () {
        expect(res.body.errors.join(" ")).to.include("Price");
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
