---
info:
  name: 09 Update Error - 422
  type: http
  seq: 9
http:
  method: PATCH
  url: "{{base_url}}/api/v1/books/{{book_id}}"
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  - name: X-CSRF-Token
    value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
        "book": {
          "title": "",
          "market_ids": []
        }
      }
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      if (!bru.getVar("book_id")) throw new Error("Run the create request for book_id first");
  - type: tests
    code: |-
      test("HTTP 422", function () {
        expect(res.status).to.equal(422);
      });
      test("JSON errors", function () {
        expect(res.body.errors).to.be.an("array").that.is.not.empty;
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
