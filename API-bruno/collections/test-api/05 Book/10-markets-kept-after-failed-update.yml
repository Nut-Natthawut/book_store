---
info:
  name: 10 Markets Kept After Failed Update - 200
  type: http
  seq: 10
http:
  method: GET
  url: "{{base_url}}/api/v1/books/{{book_id}}"
  headers:
  - name: Accept
    value: application/json
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      if (!bru.getVar("book_id")) throw new Error("Run the create request for book_id first");
  - type: tests
    code: |-
      test("HTTP 200", function () {
        expect(res.status).to.equal(200);
      });
      test("Markets unchanged", function () {
        expect(res.body.markets).to.be.an("array").that.is.not.empty;
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
