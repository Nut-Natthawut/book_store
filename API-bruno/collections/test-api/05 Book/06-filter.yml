---
info:
  name: 06 Filter Category - 200
  type: http
  seq: 6
http:
  method: GET
  url: "{{base_url}}/api/v1/books?category_id={{category_id}}"
  headers:
  - name: Accept
    value: application/json
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: if (!bru.getVar("category_id")) throw new Error("Run the create request
      for category_id first");
  - type: tests
    code: |-
      test("HTTP 200", function () {
        expect(res.status).to.equal(200);
      });
      test("Result", function () { res.body.forEach(function (b) { expect(b.category_id).to.equal(Number(bru.getVar("category_id"))); }); });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
