---
info:
  name: 03 Show - 200
  type: http
  seq: 3
http:
  method: GET
  url: "{{base_url}}/api/v1/books/{{book_id}}"
  headers:
  - name: Accept
    value: application/json
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: if (!bru.getVar("book_id")) throw new Error("Run the create request for
      book_id first");
  - type: tests
    code: |-
      test("HTTP 200", function () {
        expect(res.status).to.equal(200);
      });
      test("Relations", function () { expect(res.body.category.id).to.equal(Number(bru.getVar("category_id"))); expect(res.body.markets).to.have.lengthOf(1); });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
