---
info:
  name: 12 Unknown Category Error - 422
  type: http
  seq: 12
http:
  method: POST
  url: "{{base_url}}/api/v1/books"
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  - name: X-CSRF-Token
    value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
        "book": {
          "title": "Refactoring",
          "author": "Martin Fowler",
          "description": "ปรับปรุงโค้ดเดิมให้ดีขึ้น",
          "price": 350,
          "category_id": 999999999
        }
      }
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 422", function () {
        expect(res.status).to.equal(422);
      });
      test("JSON errors", function () {
        expect(res.body.errors).to.be.an("array").that.is.not.empty;
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
