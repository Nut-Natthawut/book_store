info:
  name: 03 Duplicate Email Error - 422
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/users"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: X-CSRF-Token
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
        "user": {
          "email_address": "narin.reader@example.com",
          "password": "1234",
          "password_confirmation": "1234",
          "role": "customer"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 422", function () {
          expect(res.status).to.equal(422);
        });
        test("JSON errors", function () {
          expect(res.body.errors).to.be.an("array").that.is.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: true
