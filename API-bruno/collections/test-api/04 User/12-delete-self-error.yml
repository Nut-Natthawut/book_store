---
info:
  name: 12 Delete Self Error - 422
  type: http
  seq: 12
http:
  method: DELETE
  url: "{{base_url}}/api/v1/users/{{current_admin_id}}"
  headers:
  - name: Accept
    value: application/json
  - name: X-CSRF-Token
    value: "{{csrf_token}}"
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      if (!bru.getVar("current_admin_id")) throw new Error("Run the create request for current_admin_id first");
  - type: tests
    code: |-
      test("HTTP 422", function () {
        expect(res.status).to.equal(422);
      });
      test("JSON errors", function () {
        expect(res.body.errors).to.be.an("array").that.is.not.empty;
      });
      test("Error message", function () {
        expect(res.body.errors.join(" ")).to.include("ลบบัญชีของตัวเอง");
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
